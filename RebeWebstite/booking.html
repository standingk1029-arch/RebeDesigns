<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
   <link rel="stylesheet" href="styling.css">
   <script src="scripting.js" defer></script>

</head>
<body>

    <div class="header-buttons">
    <a href= "index.html" class= "homebutton">HOME</a>
    <a href="booking.html" class= "bookingbutton">BOOKING</a>
    <a href="tattoos.html"class= "tattoosbutton">TATTOOS</a>
    <a href="piercings.html"class= "piercingbutton">PIERCINGS</a>
    <a href="about.html" class= "aboutbutton">ABOUT</a>

   </div>
    <div class="BookingTitle">
        <h1>Book Your Appointment</h1>
    </div>

     <div class="booking-card">
    <h2>Book An Appointment</h2>
    <form action="/submit-booking" method="POST">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label for="checkin">Appointment Date</label>
        <input type="date" id="checkin" name="checkin" required>
      </div>

     

      <div class="form-group">
        <label for="roomtype">Appointment Type</label>
        <select id="roomtype" name="roomtype">
          <option value="single">Tattoo</option>
          <option value="double">Consultation</option>
        </select>
      </div>

      <button type="submit">Confirm Booking</button>

</body>
</html>
