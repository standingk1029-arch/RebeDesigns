<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Internal Booking Management Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 40px; }
    .dashboard { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; border: 1px solid #dee2e6; text-align: left; }
    th { background-color: #007bff; color: white; }
    .clear-btn { padding: 8px 12px; background: #dc3545; color: white; border: none; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="dashboard">
    <h2>Reservations Dashboard Overview</h2>
    <button class="clear-btn" onclick="clearAllBookings()">Wipe System Logs</button>
    
    <table>
      <thead>
        <tr>
          <th>Customer Name</th>
          <th>Requested Service Block</th>
          <th>Target Calendar Date</th>
        </tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>
  </div>

  <script>
    function loadAdminDashboard() {
      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = "";
      const data = JSON.parse(localStorage.getItem('savedBookings')) || [];
      
      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${item.name}</td><td>${item.service}</td><td>${item.date}</td>`;
        tbody.appendChild(tr);
      });
    }

    function clearAllBookings() {
      if(confirm("Are you sure you want to delete all historical rows?")) {
        localStorage.removeItem('savedBookings');
        loadAdminDashboard();
      }
    }

    window.onload = loadAdminDashboard;
  </script>
</body>
</html>
